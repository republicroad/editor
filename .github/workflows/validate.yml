name: 'Validate'

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - reui

jobs:
  codequality:
    name: 'Code quality & tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Check single-instance deps (isolated store)'
        run: bun run check:single-instance

      - name: 'Lint'
        run: bun run lint

      - name: 'Typecheck (frontend)'
        run: bun run typecheck

      - name: 'Typecheck (apps)'
        run: bun run typecheck:apps

      - name: 'Test (root)'
        run: bun run test

      - name: 'Test (component)'
        run: bun run test:components

      - name: 'Test (apps/editor)'
        run: bun test apps/editor

      # 内核测试归内核仓 CI（其 validate.yaml 在自家 pnpm 树下跑 vitest 全套）：
      # 内核 devDep react 19 与宿主树混合会导致双 React 实例，宿主 CI 不可复现其门禁。
      # 宿主对内核的消费假设（npm dist 类型与运行时）由上方 Typecheck + Build job 验证。
      - name: 'Check custom-node schema fixture'
        run: bun run sync:schema:check

  build:
    name: 'Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Check single-instance deps (isolated store)'
        run: bun run check:single-instance

      - name: 'Build (frontend)'
        run: bun run build
