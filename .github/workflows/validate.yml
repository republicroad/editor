name: 'Validate'

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  codequality:
    name: 'Code quality'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Lint'
        run: bun run lint

      - name: 'Typecheck (frontend)'
        run: bun run typecheck

      - name: 'Typecheck (apps)'
        run: bun run typecheck:apps

      - name: 'zen-rule smoke test'
        run: bun run test:zen-rule

  rust-codequality:
    name: 'Rust code quality'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup update stable

      - name: 'Format'
        run: cargo fmt --check