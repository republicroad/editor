name: 'Validate'

on:
  pull_request:
  push:
    branches:
      - master
      - zrule

permissions:
  contents: read

jobs:
  codequality:
    name: 'Code quality & tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # workspace 包含 jdm-editor/packages/*，bun install 需要子模块源码
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Lint'
        run: bun run lint

      - name: 'Typecheck (frontend)'
        run: bun run typecheck

      - name: 'Typecheck (apps)'
        run: bun run typecheck:apps

      - name: 'Test (root)'
        run: bun run test

      - name: 'Test (apps)'
        run: bun test apps/zen-rule apps/editor

  build:
    name: 'Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Build (frontend)'
        run: bun run build
